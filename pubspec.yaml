name: rpm
description: Offline Receipts & Payments Manager for Windows and macOS.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.30.0
  sqlite3: ^3.1.5
  flutter_riverpod: ^3.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  file_selector: ^1.0.4
  intl: ^0.20.2
  uuid: ^4.5.2
  crypto: ^3.0.7

dev_dependencies:
  file_selector_platform_interface: ^2.7.0
  test: ^1.26.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/fonts/OFL.txt
